name: Cập nhật ELO & deploy web

on:
  schedule:
    # GitHub cron dùng giờ UTC; giờ VN = UTC+7.
    # 07:00 13:00 14:00 19:00 20:00 21:00 VN = 00:00 06:00 07:00 12:00 13:00 14:00 UTC.
    - cron: '0 0,6,7,12,13,14 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/update.yml'

permissions:
  contents: write   # để commit lại app/web/data/leaderboard.json
  pages: write      # để deploy GitHub Pages
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — cần lịch sử đầy đủ cho `git pull --rebase` ở bước lưu.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Đồng bộ kho trận lên Firebase (chỉ tải phần mới) rồi tính lại ELO
      # trong cửa sổ 6 tháng gần nhất.
      # FIREBASE_SERVICE_ACCOUNT: nội dung file JSON service account, đặt trong
      # Settings -> Secrets and variables -> Actions. App CHỈ ĐỌC kho này, chỉ
      # CI mới có quyền ghi.
      - name: Đồng bộ kho trận + tính ELO
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/compute.mjs

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cài dependency
        run: cd app && flutter pub get

      # Chặn code hỏng trước khi deploy. Trước đây CI không hề chạy test,
      # nên test đỏ ở máy vẫn deploy được lên Pages.
      - name: Kiểm tra code (analyze + test)
        run: |
          cd app
          flutter analyze
          flutter test

      # --wasm: engine WebAssembly (skwasm) render mượt hơn hẳn bản JS;
      # trình duyệt cũ không hỗ trợ WasmGC sẽ tự rơi về bản JS đi kèm.
      - name: Build web
        run: |
          cd app
          flutter build web --wasm --release --pwa-strategy=none --base-href "/${GITHUB_REPOSITORY##*/}/"

      # Chỉ lưu dữ liệu SAU KHI build thành công, để repo và web không lệch nhau.
      # [skip ci] để không tự kích hoạt lại workflow.
      - name: Lưu dữ liệu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/web/data/leaderboard.json
          if git diff --cached --quiet; then
            echo "Không có thay đổi để commit."
            exit 0
          fi
          git commit -m "chore: cập nhật ELO [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Đã push."
              exit 0
            fi
            echo "Push bị từ chối, thử lại ($i)..."
            # KHÔNG dùng -X ours: khi rebase, "ours" là bản trên remote nên
            # chiến lược đó vứt đúng dữ liệu ELO vừa tính rồi vẫn báo thành công.
            # --autostash: các bước build (compute.mjs, flutter pub get, build web)
            # để lại file tracked bị sửa nhưng không commit; không stash thì rebase
            # từ chối với "You have unstaged changes".
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
          done
          echo "Không push được sau 5 lần thử."
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
